name: Release

on:
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch:

jobs:
  test:
    uses: ./.github/workflows/rust.yml

  release:
    needs: test
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch tree-sitter-lua grammar
        run: ./scripts/fetch-tree-sitter-lua.sh

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build release binary
        run: cargo build --release --bin lua-mutation-test

      - name: Package release binary
        run: |
          mkdir -p dist
          tar -czf "dist/lua-mutation-test-x86_64-unknown-linux-gnu.tar.gz" \
            -C target/release lua-mutation-test

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Install semantic-release
        run: |
          npm install -g \
            semantic-release \
            @semantic-release/release-notes-generator \
            conventional-changelog-conventionalcommits@^7.0.0

      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release

  publish-crate:
    needs: release
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Fetch tree-sitter-lua grammar
        run: ./scripts/fetch-tree-sitter-lua.sh

      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [ -n "$CARGO_REGISTRY_TOKEN" ]; then
            cargo publish --token "$CARGO_REGISTRY_TOKEN"
          else
            echo "CARGO_REGISTRY_TOKEN not set; skipping crates.io publish"
          fi
